[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "comma-post-training"
version = "0.1.0"
description = "Research tools for openpilot driving-policy distillation and post-training"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2,<3",
    "pillow>=11,<13",
    "torch>=2.6,<3",
    "transformers>=4.57,<5",
]

[project.optional-dependencies]
teacher = [
    "onnx>=1.17,<2",
    "onnxruntime>=1.20,<2",
    "opencv-python-headless>=4.10,<5",
]

[project.scripts]
comma-train = "comma_post_training.cli:main"
comma-driving = "comma_post_training.driving.cli:main"
comma-teacher = "comma_post_training.teacher.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.14,<1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.hatch.build.targets.wheel]
packages = ["src/comma_post_training"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/third_party/openpilot",
    "/third_party/opendbc",
    "/third_party/panda",
    "/third_party/commavq",
    "/third_party/openpilot.distill",
    "/datasets",
    "/results",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
