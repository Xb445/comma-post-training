algorithm = "td3"
policy_checkpoint = "../../outputs/policy/best.pt"
output_dir = "../../outputs/td3"
steps = 100
batch_size = 8
warmup_steps = 8
capacity = 10000
env_factory = "comma_post_training.simulator.reference:ReferenceEnvironment"
action_low = [-3.0, -3.0]
action_high = [3.0, 3.0]
residual_scale = [0.5, 0.5]
gamma = 0.99
tau = 0.005
policy_delay = 2
exploration_noise = 0.1
target_noise = 0.2
noise_clip = 0.5

[env_kwargs]
horizon = 40
