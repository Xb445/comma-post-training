task = "official_residual"

[data]
manifest = "../../data/local/target-teacher/manifest.json"
history = 1
image_size = [256, 512]
require_official_teacher = true

[model]
hidden_size = 64
residual_scale = [0.5, 0.5]

[training]
output_dir = "../../outputs/adaptation/official-target"
max_steps = 2000
batch_size = 32
learning_rate = 0.0003
val_every = 100
val_batches = 0
device = "cpu"

[loss]
bc_weight = 1.0
kd_weight = 0.01
