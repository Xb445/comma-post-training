task = "policy"

[data]
manifest = "../../data/local/source-teacher/manifest.json"
history = 4
image_size = [128, 256]
require_official_teacher = true

[model]
hidden_size = 128
vision_channels = 16
vision_pool = [4, 8]
freeze_encoder = false

[training]
output_dir = "../../outputs/adaptation/student-source"
max_steps = 5000
batch_size = 8
learning_rate = 0.0003
val_every = 100
val_batches = 0
device = "auto"

[loss]
bc_weight = 1.0
kd_weight = 1.0
