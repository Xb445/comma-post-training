algorithm = "dagger"
policy_checkpoint = "../../outputs/adaptation/student-target/best.pt"
output_dir = "../../outputs/adaptation/student-dagger"
env_factory = "comma_post_training.simulator.recording:RoadEnvironment"
steps = 5000
episode_limit = 150
eval_episodes = 3
batch_size = 32
warmup_steps = 128
capacity = 20000
