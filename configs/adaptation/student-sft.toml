task = "policy"

[data]
manifest = "../../data/local/target-teacher/manifest.json"
history = 4
image_size = [128, 256]
require_official_teacher = false

[model]
hidden_size = 128
vision_channels = 16
vision_pool = [4, 8]
freeze_encoder = false
init_checkpoint = "../../outputs/adaptation/student-source/best.pt"

[training]
output_dir = "../../outputs/adaptation/student-target"
max_steps = 2000
batch_size = 8
learning_rate = 0.0001
val_every = 100
val_batches = 0
device = "auto"

[loss]
bc_weight = 1.0
# Teacher may be biased in the new environment; start with independent expert BC.
kd_weight = 0.0
